<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>roughjam</title>
		<meta name="claude:viewport-fit-sides" content="cover" />
		<meta
			name="description"
			content="A loop machine you play with friends. Sit at a ring, draw, and the eye watches."
		/>
		<meta name="theme-color" content="#0f0b1e" />
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="roughjam" />
		<meta property="og:description" content="A loop machine you play with friends." />
		<meta property="og:image" content="https://jam.0sk.ar/icons/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Syne:wght@500..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500&display=swap"
		/>
		<link rel="stylesheet" href="src/style.css" />
	</head>
	<body class="intro">
		<canvas
			id="c"
			aria-label="A loop machine. One ring per player around a shared dial. Draw on your ring to play."
		></canvas>

		<header class="panel">
			<h1>rough<em>jam</em></h1>
			<div class="jamline" id="jamline">
				<div class="jamchips">
					<button class="chip" id="wtf" aria-expanded="false" aria-controls="jam-about">
						wtf?
					</button>
					<form id="jam-about" hidden>
						<p>
							Hello, this is a live, multihuman instrument in your browser. Experiment! Have fun
							together!
						</p>
						<textarea
							aria-label="Feedback"
							aria-describedby="feedback-notice"
							placeholder="what felt off, what's missing?"
							rows="3"
							maxlength="2000"
							required
						></textarea>
						<p id="feedback-notice">
							Feedback is public. The page address and browser are sent with it.
						</p>
						<div>
							<small role="status"></small>
							<button type="submit" class="chip">Send</button>
						</div>
					</form>
				</div>
			</div>
			<p class="jamline" id="recline" aria-live="polite"></p>
		</header>

		<!-- the deck, in three groups: your ear (sound) · your ring (pen or eraser; the broom to wipe it sits by your badge) · the whole jam (tempo, robots, record).
     Fixed-size glyph tokens, nothing reflows when they toggle. -->
		<menu class="deck" id="deck">
			<li>
				<button
					id="sound"
					class="token"
					aria-pressed="false"
					aria-label="Sound"
					title="sound · space"
				>
					<svg viewBox="0 0 32 32" aria-hidden="true">
						<path d="M5 13h5l7-6v18l-7-6H5z" />
						<g class="on">
							<path d="M21 12c2 2 2 6 0 8" />
							<path d="M24 9c4 4 4 10 0 14" />
						</g>
						<g class="off"><path d="M21 12l7 8M28 12l-7 8" /></g>
					</svg>
				</button>
			</li>
			<li class="group">
				<button
					id="erase"
					class="token"
					aria-pressed="false"
					aria-label="Eraser"
					title="pen or eraser · e"
				>
					<svg viewBox="0 0 32 32" aria-hidden="true">
						<g class="off">
							<path d="M8 24l2-6L22 6l4 4-12 12z" />
							<path d="M10 18l4 4" />
							<path d="M6 27c6-2 12 1 20-2" />
						</g>
						<g class="on">
							<path d="M7 20l10-10 7 7-7 7h-6z" />
							<path class="fill" d="M7 20l4-4 7 7-1 1h-6z" />
							<path d="M6 27h20" />
						</g>
					</svg>
				</button>
			</li>
			<li class="tempo group">
				<button id="slower" class="nib" aria-label="Slower" title="slower">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3L5 8l6 5" /></svg>
				</button>
				<output id="bpm" aria-label="Tempo in beats per minute">92</output>
				<button id="faster" class="nib" aria-label="Faster" title="faster">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5" /></svg>
				</button>
			</li>
			<li>
				<button
					id="bots"
					class="token"
					aria-pressed="false"
					aria-label="Robots"
					title="robots: let machines play the empty seats, for everyone in this jam"
				>
					<svg viewBox="4.5 1.5 28 28" aria-hidden="true">
						<path
							d="M8.6 12.4 22.8 11c1.2-.1 1.8.5 1.9 1.6l.4 10.2c0 1.2-.6 1.8-1.7 1.9l-13.6.9c-1.2.1-1.8-.5-1.9-1.7l-.5-9.9c-.1-1 .4-1.5 1.2-1.6z"
						/>
						<path d="M16 11.4 15 6.6" />
						<circle class="fill" cx="14.8" cy="5.2" r="1.7" />
						<circle class="fill" cx="12.6" cy="16.9" r="1.6" />
						<circle class="fill" cx="19.6" cy="16.4" r="1.6" />
						<path d="M12.2 21.5l8.4-.5M14.4 20.3v2.3M17.2 20.1v2.3" />
						<path d="M25.1 17.6h2.2M27.3 15.4c2-.7 3 1.3 1.8 2.2 1.2.9.2 2.9-1.8 2.2z" />
					</svg>
				</button>
			</li>
			<li>
				<button
					id="rec"
					class="token"
					data-state="idle"
					aria-label="Record eight bars"
					title="record 8 bars from the next loop · get a link"
				>
					<svg viewBox="0 0 32 32" aria-hidden="true">
						<circle cx="16" cy="16" r="10" />
						<circle class="fill dot" cx="16" cy="16" r="4.5" />
						<circle class="arc" cx="16" cy="16" r="10" pathLength="1" />
					</svg>
				</button>
			</li>
		</menu>

		<!-- shown while zoomed into your instrument: every instrument as a glyph token above the sheet. Tap the machine (or Esc) to go back. -->
		<div class="sheetbar" id="sheetbar" hidden></div>

		<script type="module" src="src/main.js"></script>
	</body>
</html>
